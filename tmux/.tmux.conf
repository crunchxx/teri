# =====================================================================
#  tmux 极致配置 v2  |  前缀键: Ctrl+a (老 screen 党习惯，比 C-b 顺手)
# =====================================================================

# ---- 前缀键 ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display "✅ tmux.conf 已重载"

# ---- 基础 ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,ghostty:Tc"
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10          # vim 的 Esc 要快
set -g focus-events on          # 让 vim/程序感知焦点变化
set -g base-index 1             # 窗口从 1 数起
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g allow-rename off

# ---- 直觉分屏：| 横切 - 竖切，且继承当前目录 ----
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- 面板导航：hjkl（vim 肌肉记忆），大小写区分导航/调大小 ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r Tab last-window

# ---- 复制模式 vi 化，y 直接进系统剪贴板 ----
setw -g mode-keys vi
set -g copy-command "pbcopy"
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# ---- 状态栏（Catppuccin Mocha 手绘，与 Ghostty 同色系） ----
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 50
set -g status-right-length 60
# 左：会话名(紫底) + 当前窗口
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold]  #S #[bg=#313244,fg=#6c7086]#[default] #W"
# 右：日期时间
set -g status-right "#[fg=#cdd6f4] %m-%d %H:%M "
# 当前窗口高亮蓝，其余静音
set -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g window-status-current-format "#[bg=#89b4fa] #I:#W "
set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g window-status-separator ""

# ---- 插件（TPM 管理；已手动 clone，无需按 prefix+I） ----
# tmux-resurrect + continuum：每 15 分钟快照会话，重启电脑后 tmux 自动恢复
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# TPM 初始化必须放最后一行
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
