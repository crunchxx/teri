# Yazi File Manager Configuration

[manager]
show_hidden = true
sort_by = "modified"
sort_reverse = true
linemode = "size"

[preview]
tab_size = 2
max_width = 600
max_height = 900

[opener]
edit = [
    { run = 'nvim "$@"', block = true, for = "unix" },
]
open = [
    { run = 'open "$@"', desc = "Open", for = "macos" },
]
play = [
    { run = 'mpv "$@"', orphan = true, for = "unix" },
]

# Catppuccin Mocha 主题配置
[theme]
