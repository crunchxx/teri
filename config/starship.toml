# Starship Prompt Configuration
# Theme: Catppuccin Mocha

# 使用 Catppuccin Mocha 调色板
palette = "catppuccin_mocha"

# 格式
format = """
[╭─](overlay0)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$docker_context\
$line_break\
[╰─](overlay0)$character"""

# 右侧提示
right_format = """$cmd_duration"""

# 命令持续时间
[cmd_duration]
min_time = 500
format = "[$duration](yellow)"

# 字符提示
[character]
success_symbol = "[➜](green)"
error_symbol = "[➜](red)"
vimcmd_symbol = "[←](green)"

# 用户名
[username]
show_always = false
format = "[$user](blue) "

# 主机名
[hostname]
ssh_only = true
format = "[@$hostname](blue) "

# 目录
[directory]
home_symbol = "/Users/crunchxx"
truncation_length = 0
truncate_to_repo = false
format = "[$path](sapphire) "
style = "sapphire"

[git_branch]
symbol = " "
format = "[$symbol$branch](mauve) "

[git_status]
format = "([$all_status$ahead_behind](red) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# 编程语言
[python]
detect_extensions = []
symbol = " "
format = "[$symbol$version](yellow) "

[nodejs]
symbol = " "
format = "[$symbol$version](green) "

[rust]
symbol = " "
format = "[$symbol$version](red) "

[golang]
symbol = " "
format = "[$symbol$version](blue) "

# Docker
[docker_context]
symbol = " "
format = "[$symbol$context](blue) "
only_with_files = true

# Catppuccin Mocha 调色板
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
